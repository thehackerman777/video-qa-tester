apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: videoqa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/your-org/videoqa-orchestrator:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: ORCHESTRATOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: videoqa-secrets
                  key: api-key
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: videoqa
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: orchestrator
  type: ClusterIP
