apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: videoqa
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/videoqa-worker:latest
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: ORCHESTRATOR_URL
              value: http://orchestrator:3000
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
            - name: WORKER_CONCURRENCY
              value: "10"
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2
---
apiVersion: v1
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: videoqa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 1
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
