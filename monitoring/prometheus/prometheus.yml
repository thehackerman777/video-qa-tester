# ============================================================
# Prometheus Configuration
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - 'rules/*.yml'

scrape_configs:
  - job_name: 'videoqa-orchestrator'
    static_configs:
      - targets: ['orchestrator:3000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'videoqa-workers'
    static_configs:
      - targets:
          - 'worker:4000'
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  - job_name: 'node'
    static_configs:
      - targets:
          - 'orchestrator:3000'
    metrics_path: /metrics

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
