<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>QA Tester</title>
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-canvas-white: #ffffff;
            --color-ink-black: #0f0f0f;
            --color-medium-gray: #606060;
            --color-light-gray: #909090;
            --color-border-gray: #c6c6c6;
            --color-accent-blue: #065fd4;
            --color-youtube-red: #ff0033;
            --font-roboto: 'Roboto', ui-sans-serif, system-ui, -apple-system, sans-serif;
            --radius-lg: 10px;
            --radius-2xl: 18px;
            --card-padding: 16px;
            --section-gap: 48px;
            --element-gap: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-roboto);
            background: var(--color-canvas-white);
            color: var(--color-ink-black);
            font-size: 14px;
            line-height: 1.43;
        }
        a { color: var(--color-accent-blue); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .layout { display: flex; min-height: 100vh; max-width: 1185px; margin: 0 auto; }
        
        /* Sidebar */
        .sidebar {
            width: 240px;
            padding: 12px 12px 0 12px;
            position: sticky; top: 0; height: 100vh;
            overflow-y: auto;
        }
        .sidebar-brand {
            font-size: 20px;
            font-weight: 600;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-brand span { color: var(--color-youtube-red); }
        .nav-group { margin-bottom: 24px; }
        .nav-group-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-light-gray);
            padding: 8px 12px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px;
            color: var(--color-ink-black);
            border-radius: var(--radius-lg);
            font-size: 14px;
            transition: background 0.1s;
            text-decoration: none;
        }
        .nav-link:hover { background: rgba(0,0,0,0.05); }
        .nav-link.active { background: rgba(0,0,0,0.05); font-weight: 500; }
        .nav-link .icon { width: 20px; text-align: center; }

        /* Main content */
        .content {
            flex: 1;
            padding: 24px var(--card-padding);
            min-width: 0;
        }
        h1 {
            font-size: 20px; font-weight: 600;
            margin-bottom: 24px; line-height: 1.4;
        }
        h2 { font-size: 14px; font-weight: 500; color: var(--color-medium-gray); margin-bottom: 8px; }

        /* Cards */
        .card {
            background: var(--color-canvas-white);
            border: 1px solid #eeeeee;
            border-radius: var(--radius-lg);
            padding: var(--card-padding);
            margin-bottom: var(--element-gap);
        }
        .card-header {
            font-size: 14px; font-weight: 500;
            margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }
        .card-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: var(--element-gap);
            margin-bottom: 24px;
        }
        .stat-card {
            border: 1px solid #eeeeee;
            border-radius: var(--radius-lg);
            padding: var(--card-padding);
        }
        .stat-value { font-size: 20px; font-weight: 600; }
        .stat-label { font-size: 12px; color: var(--color-medium-gray); margin-top: 2px; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 0 16px; height: 36px;
            background: rgba(0,0,0,0.05);
            color: var(--color-ink-black);
            border: none; border-radius: var(--radius-2xl);
            font-family: var(--font-roboto); font-size: 14px; font-weight: 400;
            cursor: pointer; transition: background 0.15s;
            text-decoration: none; white-space: nowrap;
        }
        .btn:hover { background: rgba(0,0,0,0.1); }
        .btn-blue { background: var(--color-accent-blue); color: white; }
        .btn-blue:hover { background: #054da3; }
        .btn-red { color: var(--color-youtube-red); }

        /* Form elements */
        input, select, textarea {
            width: 100%; padding: 8px 12px;
            border: 1px solid var(--color-border-gray);
            border-radius: 0;
            font-family: var(--font-roboto); font-size: 14px;
            background: var(--color-canvas-white);
            color: var(--color-ink-black);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-accent-blue);
        }
        label { display: block; font-size: 12px; color: var(--color-medium-gray); margin-bottom: 2px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; font-weight: 500; color: var(--color-light-gray); padding: 8px 4px; border-bottom: 1px solid #eeeeee; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 10px 4px; border-bottom: 1px solid #eeeeee; }
        tr:hover td { background: rgba(0,0,0,0.02); }

        /* Badges */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 40px; font-size: 12px; font-weight: 500; }
        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-red { background: #fbe9e7; color: #c62828; }
        .badge-amber { background: #fff8e1; color: #f57f17; }
        .badge-blue { background: #e3f2fd; color: #065fd4; }

        /* Logs */
        .log-box {
            background: #f9f9f9;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            padding: var(--card-padding);
            border: 1px solid #eeeeee;
            border-radius: var(--radius-lg);
            max-height: 500px;
            overflow-y: auto;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-box .info { color: #2e7d32; }
        .log-box .warn { color: #e65100; }
        .log-box .error { color: #c62828; }
        .log-box .debug { color: #1565c0; }
        .log-box .time { color: #9e9e9e; }

        /* Layout helpers */
        .flex { display: flex; }
        .flex-1 { flex: 1; }
        .gap-2 { gap: var(--spacing-8, 8px); }
        .gap-4 { gap: var(--element-gap); }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--element-gap); }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 250px; }
        .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }
        .text-sm { font-size: 12px; }
        .text-muted { color: var(--color-medium-gray); }
        .text-accent { color: var(--color-accent-blue); }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-4 { margin-bottom: 16px; }
        .hidden { display: none; }

        /* Spinner */
        .spinner { width: 16px; height: 16px; border: 2px solid #eee; border-top-color: var(--color-accent-blue); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 3px; }

        .skeleton { background: #f0f0f0; border-radius: 4px; animation: pulse 1.5s infinite; display: inline-block; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Mobile Responsive */
        .menu-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 100; width: 36px; height: 36px; background: var(--color-canvas-white); border: 1px solid #eee; border-radius: 50%; cursor: pointer; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .menu-toggle:hover { background: #f5f5f5; }
        .sidebar-overlay { display: none; }

        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            .layout { flex-direction: column; }
            .sidebar {
                position: fixed; top: 0; left: -280px; width: 280px;
                z-index: 99; height: 100vh;
                background: var(--color-canvas-white);
                box-shadow: 2px 0 20px rgba(0,0,0,0.1);
                transition: left 0.25s ease;
            }
            .sidebar.open { left: 0; }
            .sidebar-overlay {
                display: none; position: fixed; inset: 0;
                background: rgba(0,0,0,0.3); z-index: 98;
            }
            .sidebar-overlay.show { display: block; }
            .content { padding: 56px 12px 12px; }
            .card { padding: 12px; }
            .card-stats { grid-template-columns: 1fr 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
            .row { flex-direction: column; }
            table { font-size: 12px; }
            .truncate { max-width: 120px; }
            .status-bar { display: none; }
        }

        @media (max-width: 480px) {
            .card-stats { grid-template-columns: 1fr 1fr; gap: 4px; }
            .stat-card { padding: 10px; }
            .stat-value { font-size: 16px; }
            .btn { font-size: 12px; height: 32px; padding: 0 12px; }
            .nav-link { font-size: 13px; padding: 10px 12px; }
        }

        .status-bar {
            border-top: 1px solid #eee;
            padding: 12px;
            margin-top: auto;
            font-size: 12px;
            color: var(--color-medium-gray);
        }
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: var(--color-ink-black); color: white;
            padding: 12px 20px; border-radius: var(--radius-2xl);
            font-size: 13px; z-index: 100;
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>
<div class="layout">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand"><span>▶</span> QA Tester</div>

        <div class="nav-group">
            <div class="nav-group-title">Main</div>
            <a href="/" class="nav-link {% if page == 'dashboard' %}active{% endif %}" hx-boost="true">
                <span class="icon">📊</span> Dashboard
            </a>
            <a href="/test" class="nav-link {% if page == 'test' %}active{% endif %}" hx-boost="true">
                <span class="icon">🧪</span> Tests
            </a>
        </div>

        <div class="nav-group">
            <div class="nav-group-title">Configuration</div>
            <a href="/sessions" class="nav-link {% if page == 'sessions' %}active{% endif %}" hx-boost="true">
                <span class="icon">🔑</span> Sessions
            </a>
            <a href="/channels" class="nav-link {% if page == 'channels' %}active{% endif %}" hx-boost="true">
                <span class="icon">📡</span> Channels
            </a>
        </div>

        <div class="nav-group">
            <div class="nav-group-title">System</div>
            <a href="/logs" class="nav-link {% if page == 'logs' %}active{% endif %}" hx-boost="true">
                <span class="icon">📋</span> Logs
            </a>
        </div>

        <div class="status-bar">
            <div id="status-text">—</div>
        </div>
    </nav>

    <main class="content" id="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

<div id="toast" class="toast"></div>

<script>
    // Status polling
    setInterval(() => {
        fetch('/api/status').then(r=>r.json()).then(d => {
            document.getElementById('status-text').textContent =
                `${d.sessions} sessions · ${d.running_tasks} running · ${d.recent_results} results`;
        }).catch(() => {});
    }, 2000);

    // Toast notifications
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Mobile menu
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('show');
        document.getElementById('menuToggle').textContent =
            document.getElementById('sidebar').classList.contains('open') ? '✕' : '☰';
    }
    // Close sidebar on nav click (mobile)
    document.querySelectorAll('.nav-link').forEach(l => {
        l.addEventListener('click', () => {
            if (window.innerWidth <= 768) toggleMenu();
        });
    });

    // HTMX events
    document.body.addEventListener('htmx:afterSwap', function(e) {
        try {
            const data = JSON.parse(e.detail.serverResponse);
            if (data.status === 'started') showToast('Task started: ' + data.task_id);
            if (data.status === 'ok') showToast(data.session ? 'Session: ' + data.session : 'Done');
        } catch(_) {}
    });
    document.body.addEventListener('htmx:responseError', function(e) {
        try {
            const d = JSON.parse(e.detail.xhr.responseText);
            showToast('❌ ' + (d.message || d.detail || 'Error'));
        } catch(_) {
            showToast('❌ Request failed');
        }
    });
</script>
</body>
</html>
