{% extends "base.html" %}
{% block content %}
<h1>📡 Channel Scanner</h1>

<div class="card">
    <form hx-post="/api/scan" hx-target="#results" hx-indicator="#spinner">
        <div class="row">
            <div class="col flex-1">
                <label>Channel</label>
                <input type="text" name="channel" placeholder="@elpepe8659 or UC...">
            </div>
            <div style="width:100px">
                <label>Max</label>
                <input type="number" name="max_videos" value="50">
            </div>
            <div style="width:120px">
                <label>Sort</label>
                <select name="sort">
                    <option value="views">By Views</option>
                    <option value="newest">Newest</option>
                </select>
            </div>
            <div style="display:flex;align-items:flex-end">
                <button type="submit" class="btn btn-orange">🔍 Scan</button>
                <span id="spinner" class="spinner hidden" style="margin-left:8px"></span>
            </div>
        </div>
        <div class="mt-2">
            <label>Search (optional)</label>
            <input type="text" name="search" placeholder="Filter by title...">
        </div>
    </form>
</div>

<div id="results">
    <div class="card" style="text-align:center;padding:60px 0;color:var(--color-silver-ash)">
        <div style="font-size:40px;margin-bottom:8px">📡</div>
        <div>Enter a channel and click Scan</div>
        <div class="text-sm">e.g. @elpepe8659</div>
    </div>
</div>

<script>
    document.body.addEventListener('htmx:configRequest', function(evt) {
        if (evt.detail.target.id === 'results' && evt.detail.path === '/api/scan') {
            evt.detail.parameters.search = document.querySelector('input[name="search"]').value;
        }
    });
    document.body.addEventListener('htmx:beforeSwap', function(evt) {
        if (evt.detail.path === '/api/scan') {
            try { const d = JSON.parse(evt.detail.serverResponse); renderVideos(d); evt.detail.shouldSwap = false; }
            catch(e) { console.error(e); }
        }
    });
    function renderVideos(d) {
        const el = document.getElementById('results');
        if (!d.videos || d.videos.length === 0) {
            el.innerHTML = '<div class="card" style="text-align:center;padding:40px;color:var(--color-silver-ash)">No videos found</div>';
            return;
        }
        let html = `<div class="card"><div class="flex justify-between items-center mb-2"><span class="text-sm text-muted">${d.total} videos</span><button class="btn btn-sm" onclick="document.getElementById('test-url').value='${d.videos[0]?.url||''}';window.location='/test'">Test Top Video →</button></div><div style="max-height:600px;overflow-y:auto">`;
        d.videos.forEach((v,i) => {
            html += `<div class="flex items-center gap-2" style="padding:8px 4px;border-bottom:1px solid var(--color-light-pearl)">
                <span class="text-sm text-muted" style="width:24px">${i+1}</span>
                <div class="flex-1 truncate"><span class="text-sm">${v.title}</span><div class="text-xs text-muted">${v.views?.toLocaleString()||'N/A'} views · ${v.id}</div></div>
                <button class="btn btn-sm" onclick="navigator.clipboard.writeText('${v.url}')">📋</button>
            </div>`;
        });
        html += '</div></div>';
        el.innerHTML = html;
    }
</script>
{% endblock %}
